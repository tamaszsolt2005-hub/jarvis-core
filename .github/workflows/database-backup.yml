name: JARVIS encrypted database backup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/database-backup.yml"
      - "scripts/supabase_backup.py"
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: jarvis-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      JARVIS_BACKUP_SOURCE_PROJECT_REF: ${{ vars.JARVIS_BACKUP_SOURCE_PROJECT_REF }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      BACKUP_S3_KMS_KEY_ARN: ${{ vars.BACKUP_S3_KMS_KEY_ARN }}
      AWS_DEFAULT_REGION: ${{ vars.BACKUP_AWS_REGION }}
      AWS_BACKUP_ROLE_ARN: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check external backup configuration
        id: config
        shell: bash
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          missing=()
          [[ -n "$SUPABASE_DB_URL" ]] || missing+=("SUPABASE_DB_URL secret")
          [[ -n "$JARVIS_BACKUP_SOURCE_PROJECT_REF" ]] || missing+=("JARVIS_BACKUP_SOURCE_PROJECT_REF variable")
          [[ -n "$BACKUP_AGE_RECIPIENT" ]] || missing+=("BACKUP_AGE_RECIPIENT variable")
          [[ -n "$BACKUP_S3_BUCKET" ]] || missing+=("BACKUP_S3_BUCKET variable")
          [[ -n "$BACKUP_S3_KMS_KEY_ARN" ]] || missing+=("BACKUP_S3_KMS_KEY_ARN variable")
          [[ -n "$AWS_DEFAULT_REGION" ]] || missing+=("BACKUP_AWS_REGION variable")
          [[ -n "$AWS_BACKUP_ROLE_ARN" ]] || missing+=("AWS_BACKUP_ROLE_ARN secret")
          [[ -n "$BACKUP_AGE_IDENTITY" ]] || missing+=("BACKUP_AGE_IDENTITY secret")
          if [[ -n "${missing[*]-}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "## Backup NOT performed" >> "$GITHUB_STEP_SUMMARY"
            echo "- Missing required configuration: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Backup cannot run; required secrets/variables are missing: ${missing[*]}"
            exit 1
          fi
          if [[ "$JARVIS_BACKUP_SOURCE_PROJECT_REF" != "kiutreccucbegskxowek" ]]; then
            echo "::error::Backup source project ref does not match the approved JARVIS production project."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Prepare age decryption identity
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/jarvis-age-identity.txt"
          printf '%s\n' "$BACKUP_AGE_IDENTITY" > "$identity"
          if ! grep -Eq '^[[:space:]]*AGE-SECRET-KEY-1[0-9A-Z]+[[:space:]]*$' "$identity"; then
            echo "::error::BACKUP_AGE_IDENTITY must contain the private age identity (AGE-SECRET-KEY-1...), not the public age1 recipient or a JSON/quoted value."
            exit 1
          fi
          chmod 600 "$identity"
          echo "AGE_IDENTITY_FILE=$identity" >> "$GITHUB_ENV"

      - name: Install PostgreSQL 17 client, age and AWS CLI
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17 age
          # Ubuntu 24.04 runner images may not expose an apt candidate for awscli.
          # Install the official AWS CLI v2 bundle instead of relying on Ubuntu's package index.
          curl --fail --silent --show-error --location \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            --output "$RUNNER_TEMP/awscliv2.zip"
          unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP"
          sudo "$RUNNER_TEMP/aws/install" --update
          aws --version
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version | grep -Eq ' 17\.'
          pg_restore --version | grep -Eq ' 17\.'
          psql --version | grep -Eq ' 17\.'

      - name: Create encrypted production logical backup
        if: steps.config.outputs.ready == 'true'
        run: python3 scripts/supabase_backup.py backup --output-dir .private-backups

      - name: Configure AWS role through GitHub OIDC
        if: steps.config.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
          aws-region: ${{ vars.BACKUP_AWS_REGION }}

      - name: Upload encrypted backup to private S3 bucket
        if: steps.config.outputs.ready == 'true'
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          file="$(find .private-backups -maxdepth 1 -type f -name '*.tar.gz.age' -print -quit)"
          [[ -n "$file" ]]
          key="jarvis/database/$(basename "$file")"
          aws s3 cp "$file" "s3://$BACKUP_S3_BUCKET/$key" --sse aws:kms --sse-kms-key-id "$BACKUP_S3_KMS_KEY_ARN" --only-show-errors
          echo "s3_key=$key" >> "$GITHUB_OUTPUT"

      - name: Verify uploaded S3 object, KMS encryption and encrypted manifest
        if: steps.config.outputs.ready == 'true'
        shell: bash
        id: verify
        env:
          BACKUP_S3_KEY: ${{ steps.upload.outputs.s3_key }}
        run: |
          set -euo pipefail
          head_json="$(aws s3api head-object --bucket "$BACKUP_S3_BUCKET" --key "$BACKUP_S3_KEY")"
          printf '%s' "$head_json" | python3 -c '
          import json, os, sys
          obj = json.load(sys.stdin)
          expected_key = os.environ["BACKUP_S3_KMS_KEY_ARN"]
          if obj.get("ServerSideEncryption") != "aws:kms":
              raise SystemExit("S3 object is not SSE-KMS encrypted")
          if obj.get("SSEKMSKeyId") != expected_key:
              raise SystemExit("S3 object uses an unexpected KMS key")
          if not isinstance(obj.get("ContentLength"), int) or obj["ContentLength"] <= 0:
              raise SystemExit("S3 object size is invalid")
          print(f"S3 object verified: {obj['ContentLength']} bytes; SSE-KMS key matches.")
          '
          mkdir -p "$RUNNER_TEMP/jarvis-backup-verify"
          downloaded="$RUNNER_TEMP/jarvis-backup-verify/$(basename "$BACKUP_S3_KEY")"
          aws s3 cp "s3://$BACKUP_S3_BUCKET/$BACKUP_S3_KEY" "$downloaded" --only-show-errors
          python3 scripts/supabase_backup.py verify --archive "$downloaded"
          echo "## Production backup object verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- S3 object metadata confirms SSE-KMS with the configured key." >> "$GITHUB_STEP_SUMMARY"
          echo "- Downloaded encrypted object decrypted and its manifest SHA-256 hashes matched." >> "$GITHUB_STEP_SUMMARY"
          echo "verified_archive=$downloaded" >> "$GITHUB_OUTPUT"

      - name: Start disposable PostgreSQL 17 restore target
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          RESTORE_PASSWORD: jarvis-ci-only-restore-password
        run: |
          set -euo pipefail
          docker run --detach --name jarvis-restore-target \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_PASSWORD="$RESTORE_PASSWORD" \
            --health-cmd="pg_isready -U postgres" \
            --health-interval=2s --health-timeout=3s --health-retries=30 \
            postgres:17
          for attempt in $(seq 1 30); do
            if docker exec jarvis-restore-target pg_isready -U postgres; then break; fi
            sleep 2
          done
          docker exec jarvis-restore-target psql -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;"

      - name: Restore production backup into separate isolated PostgreSQL 17 database
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          BACKUP_S3_KEY: ${{ steps.upload.outputs.s3_key }}
          JARVIS_RESTORE_DB_URL: postgresql://postgres:jarvis-ci-only-restore-password@127.0.0.1:5432/postgres
          JARVIS_RESTORE_ALLOWED_PROJECT_REF: local-test
          JARVIS_RESTORE_ALLOW_LOCAL_TEST_DB: "true"
        run: |
          set -euo pipefail
          downloaded="$RUNNER_TEMP/jarvis-backup-verify/$(basename "$BACKUP_S3_KEY")"
          [[ -s "$downloaded" ]]
          python3 scripts/supabase_backup.py restore \
            --archive "$downloaded" \
            --target-project-ref local-test \
            --confirm-restore
          export PGPASSWORD=jarvis-ci-only-restore-password
          summary="$(psql --no-psqlrc --tuples-only --no-align \
            --dbname "$JARVIS_RESTORE_DB_URL" \
            --command "SELECT jsonb_build_object(
              'tables', (SELECT jsonb_agg(tablename ORDER BY tablename) FROM pg_tables WHERE schemaname='public'),
              'leads', (SELECT count(*) FROM public.leads),
              'logs', (SELECT count(*) FROM public.logs),
              'settings', (SELECT count(*) FROM public.settings)
            )::text;")"
          printf '%s\n' "$summary" | python3 -c '
          import json, sys
          result = json.loads(sys.stdin.read())
          expected = {"email_drafts", "jarvis_memory", "jarvis_proactive_state", "leads", "logs", "posts", "settings", "tasks"}
          actual = set(result.get("tables") or [])
          if actual != expected:
              raise SystemExit(f"Restored table inventory mismatch: {sorted(actual)}")
          for table in ("leads", "logs", "settings"):
              if not isinstance(result.get(table), int):
                  raise SystemExit(f"Missing restored row-count check for {table}")
          print("Separate PostgreSQL 17 restore verified: 8 expected public tables; row counts captured.")
          '
          echo "## Separate-database restore drill passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Downloaded the encrypted S3 object, decrypted it, verified manifest hashes, and restored it to a fresh PostgreSQL 17 container." >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified the exact eight-table production public-schema inventory and recorded leads/logs/settings row counts." >> "$GITHUB_STEP_SUMMARY"
          echo "- No production database writes were performed." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local backup files and restore container
        if: always()
        shell: bash
        run: |
          rm -rf .private-backups "$RUNNER_TEMP/jarvis-backup-verify" "$RUNNER_TEMP/jarvis-age-identity.txt"
          docker rm --force jarvis-restore-target >/dev/null 2>&1 || true
