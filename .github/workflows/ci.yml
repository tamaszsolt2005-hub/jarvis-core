name: JARVIS CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - name: Validate AWS CloudFormation templates
        run: |
          python -m venv .cfn-lint-venv
          .cfn-lint-venv/bin/python -m pip install cfn-lint==1.61.0
          .cfn-lint-venv/bin/cfn-lint infra/aws-backup-stack.yaml
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python -m compileall -q .
      - name: Run unit, AppTest and browser tests
        env:
          JARVIS_BROWSER_ARTIFACT_DIR: test-results
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload responsive UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-dashboard-responsive-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  backup-restore-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JARVIS_BACKUP_SOURCE_PROJECT_REF: local-test
      JARVIS_BACKUP_ALLOW_LOCAL_TEST_DB: "true"
      JARVIS_RESTORE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/restore
      JARVIS_RESTORE_ALLOWED_PROJECT_REF: local-test
      JARVIS_RESTORE_ALLOW_LOCAL_TEST_DB: "true"
      JARVIS_BACKUP_INTEGRATION_TEST: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Install PostgreSQL 17 client and age
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version | grep -F " 17."
          pg_restore --version | grep -F " 17."
          psql --version | grep -F " 17."
      - name: Create isolated restore database and age identity
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          PGPASSWORD=postgres createdb --host 127.0.0.1 --username postgres restore
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:5432/restore" \
            --set ON_ERROR_STOP=1 --command "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role NOLOGIN BYPASSRLS;"
          age-keygen --output "$RUNNER_TEMP/jarvis-age-identity.txt" 2> "$RUNNER_TEMP/age-keygen.log"
          chmod 600 "$RUNNER_TEMP/jarvis-age-identity.txt"
          recipient="$(age-keygen -y "$RUNNER_TEMP/jarvis-age-identity.txt")"
          echo "BACKUP_AGE_RECIPIENT=$recipient" >> "$GITHUB_ENV"
          echo "AGE_IDENTITY_FILE=$RUNNER_TEMP/jarvis-age-identity.txt" >> "$GITHUB_ENV"
      - name: Install pgTAP and pgcrypto in the PostgreSQL service
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n1)"
          test -n "$container_id"
          docker exec -u root "$container_id" bash -lc 'apt-get update && apt-get install --yes postgresql-17-pgtap postgresql-contrib-17'
      - name: Run structured audit migrations and pgTAP security tests
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          audit_url="postgresql://postgres:postgres@127.0.0.1:5432/audit_test"
          PGPASSWORD=postgres createdb --host 127.0.0.1 --username postgres audit_test
          cat > "$RUNNER_TEMP/audit-test-setup.sql" <<'SQL'
          CREATE SCHEMA auth;
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          CREATE EXTENSION pgtap;
          CREATE OR REPLACE FUNCTION auth.jwt()
          RETURNS jsonb LANGUAGE sql STABLE
          AS 'SELECT current_setting(''request.jwt.claims'', true)::jsonb';
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid LANGUAGE sql STABLE
          AS 'SELECT nullif(current_setting(''request.jwt.claims'', true)::jsonb ->> ''sub'', '''')::uuid';
          GRANT USAGE ON SCHEMA auth, extensions TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.jwt() TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated, service_role;
          -- Mirror the live Jarvis production table definitions captured by
          -- the read-only catalog snapshot (PostgreSQL 17). Existing RLS is
          -- already enabled in production before these additive migrations.
          CREATE TABLE public.leads (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            company_name text NOT NULL,
            email text,
            status text DEFAULT 'new',
            created_at timestamptz NOT NULL DEFAULT timezone('utc', now()),
            consent_basis text,
            approved_to_contact boolean NOT NULL DEFAULT false,
            consent_confirmed_at timestamptz,
            opted_out boolean NOT NULL DEFAULT false,
            first_sent_at timestamptz,
            next_follow_up_at timestamptz,
            follow_up_count integer NOT NULL DEFAULT 0,
            followed_up_at timestamptz,
            last_message_id text,
            last_inbound_message_id text,
            reply_category text,
            updated_at timestamptz NOT NULL DEFAULT now(),
            website text,
            notes text,
            source text
          );
          CREATE TABLE public.tasks (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            lead_id uuid REFERENCES public.leads(id) ON DELETE SET NULL,
            title text NOT NULL,
            notes text,
            priority text NOT NULL DEFAULT 'normal'
              CHECK (priority = ANY (ARRAY['normal','high','urgent']::text[])),
            status text NOT NULL DEFAULT 'open'
              CHECK (status = ANY (ARRAY['open','done','cancelled']::text[])),
            due_at timestamptz,
            completed_at timestamptz,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE public.email_drafts (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            lead_id uuid REFERENCES public.leads(id) ON DELETE SET NULL,
            recipient text NOT NULL,
            subject text NOT NULL,
            body text NOT NULL,
            status text NOT NULL DEFAULT 'draft'
              CHECK (status = ANY (ARRAY['draft','approved','archived']::text[])),
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE public.settings (
            id serial PRIMARY KEY,
            key text NOT NULL UNIQUE,
            value jsonb,
            updated_at timestamp without time zone DEFAULT now()
          );
          CREATE TABLE public.logs (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            module text NOT NULL,
            message text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT timezone('utc', now()),
            level text NOT NULL DEFAULT 'info'
          );
          CREATE TABLE public.jarvis_memory (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            category text NOT NULL DEFAULT 'business_preference',
            content text NOT NULL CHECK (char_length(content) BETWEEN 1 AND 700),
            source text NOT NULL DEFAULT 'explicit_user_instruction',
            active boolean NOT NULL DEFAULT true,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE public.jarvis_proactive_state (
            key text PRIMARY KEY,
            snapshot jsonb NOT NULL DEFAULT '{}'::jsonb,
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE public.posts (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            content text NOT NULL,
            scheduled_for timestamptz,
            status text DEFAULT 'pending',
            created_at timestamptz NOT NULL DEFAULT timezone('utc', now())
          );
          ALTER TABLE public.leads ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.tasks ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.email_drafts ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.settings ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.logs ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.jarvis_memory ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.jarvis_proactive_state ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.posts ENABLE ROW LEVEL SECURITY;
          -- Simulate a legacy production row written before structured audit
          -- columns and hash-chain triggers were introduced.
          INSERT INTO public.logs (id, module, message, level)
          VALUES ('80000000-0000-0000-0000-000000000001',
                  'legacy_fixture', 'preserve this pre-migration event', 'info');
          SQL
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file "$RUNNER_TEMP/audit-test-setup.sql"
          # Replay the repository's historical, idempotent schema migrations
          # against the production-shape fixture before the audit/RBAC chain.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261117_add_leads_website.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261117_add_logs_level.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261119191911_create_jarvis_memory_and_fk_indexes.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261119192040_complete_jarvis_runtime_schema.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261119192145_enable_rls_on_legacy_posts.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261119192412_revoke_anon_authenticated_public_table_and_sequence_privileges.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261119192559_secure_postgres_default_privileges_public_schema.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261120090000_expand_logs_audit_fields.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261123093000_admin_audit_access_and_hash_chain.sql
          output="$(PGPASSWORD=postgres psql --no-psqlrc --no-align --tuples-only "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/audit_access_and_integrity.test.sql)"
          printf '%s\n' "$output"
          if grep -q '^not ok ' <<< "$output"; then
            echo "pgTAP reported failed audit assertions."
            exit 1
          fi
          grep -q '1..17' <<< "$output"
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261124130000_shared_workspace_role_access.sql
          rbac_output="$(PGPASSWORD=postgres psql --no-psqlrc --no-align --tuples-only "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/shared_workspace_role_access.test.sql)"
          printf '%s\n' "$rbac_output"
          if grep -q '^not ok ' <<< "$rbac_output"; then
            echo "pgTAP reported failed RBAC assertions."
            exit 1
          fi
          grep -q '1..31' <<< "$rbac_output"
      - name: Run real encrypted backup and restore roundtrip
        run: python -m pytest -q tests/test_backup_restore_integration.py
      - name: Remove test age identity
        if: always()
        run: rm -f "$RUNNER_TEMP/jarvis-age-identity.txt" "$RUNNER_TEMP/age-keygen.log"
