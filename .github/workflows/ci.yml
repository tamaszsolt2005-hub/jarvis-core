name: JARVIS CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - name: Validate AWS CloudFormation templates
        run: |
          python -m venv .cfn-lint-venv
          .cfn-lint-venv/bin/python -m pip install cfn-lint==1.61.0
          .cfn-lint-venv/bin/cfn-lint infra/aws-backup-stack.yaml
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python -m compileall -q .
      - name: Run unit, AppTest and browser tests
        env:
          JARVIS_BROWSER_ARTIFACT_DIR: test-results
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload responsive UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-dashboard-responsive-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  backup-restore-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JARVIS_BACKUP_SOURCE_PROJECT_REF: local-test
      JARVIS_BACKUP_ALLOW_LOCAL_TEST_DB: "true"
      JARVIS_RESTORE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/restore
      JARVIS_RESTORE_ALLOWED_PROJECT_REF: local-test
      JARVIS_RESTORE_ALLOW_LOCAL_TEST_DB: "true"
      JARVIS_BACKUP_INTEGRATION_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Install PostgreSQL 17 client and age
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version | grep -F " 17."
          pg_restore --version | grep -F " 17."
          psql --version | grep -F " 17."
      - name: Create isolated restore database and age identity
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          PGPASSWORD=postgres createdb --host 127.0.0.1 --username postgres restore
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:5432/restore" \\
            --set ON_ERROR_STOP=1 --command "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role NOLOGIN BYPASSRLS;"
          age-keygen --output "$RUNNER_TEMP/jarvis-age-identity.txt" 2> "$RUNNER_TEMP/age-keygen.log"
          chmod 600 "$RUNNER_TEMP/jarvis-age-identity.txt"
          recipient="$(age-keygen -y "$RUNNER_TEMP/jarvis-age-identity.txt")"
          echo "BACKUP_AGE_RECIPIENT=$recipient" >> "$GITHUB_ENV"
          echo "AGE_IDENTITY_FILE=$RUNNER_TEMP/jarvis-age-identity.txt" >> "$GITHUB_ENV"
      - name: Install pgTAP and pgcrypto in the PostgreSQL service
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n1)"
          test -n "$container_id"
          docker exec -u root "$container_id" bash -lc 'apt-get update && apt-get install --yes postgresql-17-pgtap postgresql-contrib-17'
      - name: Run structured audit migrations and pgTAP security tests
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          audit_url="postgresql://postgres:postgres@127.0.0.1:5432/audit_test"
          PGPASSWORD=postgres createdb --host 127.0.0.1 --username postgres audit_test
          cat > "$RUNNER_TEMP/audit-test-setup.sql" <<'SQL'
          CREATE SCHEMA auth;
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          CREATE EXTENSION pgtap;
          CREATE OR REPLACE FUNCTION auth.jwt()
          RETURNS jsonb LANGUAGE sql STABLE
          AS 'SELECT current_setting(''request.jwt.claims'', true)::jsonb';
          GRANT USAGE ON SCHEMA auth, extensions TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.jwt() TO authenticated, service_role;
          CREATE TABLE public.logs (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            module text NOT NULL,
            message text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now(),
            level text NOT NULL DEFAULT 'info'
          );
          SQL
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file "$RUNNER_TEMP/audit-test-setup.sql"
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261120090000_expand_logs_audit_fields.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261123093000_admin_audit_access_and_hash_chain.sql
          output="$(PGPASSWORD=postgres psql --no-psqlrc --no-align --tuples-only "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/audit_access_and_integrity.test.sql)"
          printf '%s\n' "$output"
          if grep -q '^not ok ' <<< "$output"; then
            echo "pgTAP reported failed audit assertions."
            exit 1
          fi
          grep -q '1..15' <<< "$output"
      - name: Run real encrypted backup and restore roundtrip
        run: python -m pytest -q tests/test_backup_restore_integration.py
      - name: Remove test age identity
        if: always()
        run: rm -f "$RUNNER_TEMP/jarvis-age-identity.txt" "$RUNNER_TEMP/age-keygen.log"
