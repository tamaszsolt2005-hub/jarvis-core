name: JARVIS CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - name: Validate AWS CloudFormation templates
        run: |
          python -m venv .cfn-lint-venv
          .cfn-lint-venv/bin/python -m pip install cfn-lint==1.61.0
          .cfn-lint-venv/bin/cfn-lint infra/aws-backup-stack.yaml
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: python -m compileall -q .
      - name: Run unit, AppTest and browser tests
        env:
          JARVIS_BROWSER_ARTIFACT_DIR: test-results
        run: python -m pytest -q --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload responsive UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-dashboard-responsive-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  backup-restore-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      JARVIS_BACKUP_SOURCE_PROJECT_REF: local-test
      JARVIS_BACKUP_ALLOW_LOCAL_TEST_DB: "true"
      JARVIS_RESTORE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/restore
      JARVIS_RESTORE_ALLOWED_PROJECT_REF: local-test
      JARVIS_RESTORE_ALLOW_LOCAL_TEST_DB: "true"
      JARVIS_BACKUP_INTEGRATION_TEST: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Install PostgreSQL 17 client and age
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version | grep -F " 17."
          pg_restore --version | grep -F " 17."
          psql --version | grep -F " 17."
      - name: Create isolated restore database and age identity
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          PGPASSWORD=postgres createdb --host 127.0.0.1 --username postgres restore
          PGPASSWORD=postgres psql "postgresql://postgres@127.0.0.1:5432/restore" \
            --set ON_ERROR_STOP=1 --command "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role NOLOGIN BYPASSRLS;"
          age-keygen --output "$RUNNER_TEMP/jarvis-age-identity.txt" 2> "$RUNNER_TEMP/age-keygen.log"
          chmod 600 "$RUNNER_TEMP/jarvis-age-identity.txt"
          recipient="$(age-keygen -y "$RUNNER_TEMP/jarvis-age-identity.txt")"
          echo "BACKUP_AGE_RECIPIENT=$recipient" >> "$GITHUB_ENV"
          echo "AGE_IDENTITY_FILE=$RUNNER_TEMP/jarvis-age-identity.txt" >> "$GITHUB_ENV"
      - name: Install pgTAP and pgcrypto in the PostgreSQL service
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n1)"
          test -n "$container_id"
          docker exec -u root "$container_id" bash -lc 'apt-get update && apt-get install --yes postgresql-17-pgtap postgresql-contrib-17'
      - name: Install pinned Supabase CLI for isolated migration-history tests
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Validate 20261117 migration drift and legacy data preservation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          drift_url="postgresql://postgres:postgres@127.0.0.1:5432/migration_drift_test"
          PGPASSWORD=postgres createdb --host 127.0.0.1 --username postgres migration_drift_test
          PGPASSWORD=postgres psql "$drift_url" --set ON_ERROR_STOP=1 --file supabase/tests/migration_drift_recovery.test.sql
          # Replaying both missing-ledger migrations is safe only because the
          # fixture proves their effects already exist and the SQL is additive.
          PGPASSWORD=postgres psql "$drift_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261117090000_add_leads_website.sql
          PGPASSWORD=postgres psql "$drift_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261117100000_add_logs_level.sql
          # Repeat to prove idempotence against an already-upgraded schema.
          PGPASSWORD=postgres psql "$drift_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261117090000_add_leads_website.sql
          PGPASSWORD=postgres psql "$drift_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261117100000_add_logs_level.sql
          # Model a migration process stopping after a committed prefix of the
          # audit expansion file: several columns and one index already exist.
          # Replay the complete file and verify IF NOT EXISTS recovers cleanly.
          PGPASSWORD=postgres psql "$drift_url" --set ON_ERROR_STOP=1 --command \
            "ALTER TABLE public.logs ADD COLUMN operation_id uuid, ADD COLUMN action text, ADD COLUMN status text NOT NULL DEFAULT 'unknown'"
          PGPASSWORD=postgres psql "$drift_url" --set ON_ERROR_STOP=1 --command \
            "CREATE INDEX logs_created_at_desc_idx ON public.logs (created_at DESC)"
          PGPASSWORD=postgres psql "$drift_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261120090000_expand_logs_audit_fields.sql
          PGPASSWORD=postgres psql "$drift_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261120090000_expand_logs_audit_fields.sql
          PGPASSWORD=postgres psql "$drift_url" --set ON_ERROR_STOP=1 <<'SQL'
          DO $migration_check$
          DECLARE
            versions integer;
            lead_website text;
            log_level text;
            setting_id_type text;
            next_setting_id bigint;
          BEGIN
            SELECT count(*) INTO versions FROM public.jarvis_migration_ledger_fixture;
            IF versions <> 5 THEN RAISE EXCEPTION 'remote ledger fixture changed'; END IF;
            SELECT website INTO lead_website FROM public.leads
             WHERE id = '80000000-0000-0000-0000-000000000011';
            IF lead_website <> 'https://example.invalid' THEN
              RAISE EXCEPTION 'legacy lead row was not preserved';
            END IF;
            SELECT level INTO log_level FROM public.logs
             WHERE id = '80000000-0000-0000-0000-000000000012';
            IF log_level <> 'warning' THEN RAISE EXCEPTION 'legacy log row was not preserved'; END IF;
            IF (SELECT count(*) FROM public.settings WHERE key='legacy_key') <> 1 THEN
              RAISE EXCEPTION 'legacy settings row was not preserved';
            END IF;
            IF (SELECT count(*) FROM public.posts WHERE content='legacy post') <> 1 THEN
              RAISE EXCEPTION 'legacy posts row was not preserved';
            END IF;
            SELECT data_type INTO setting_id_type
              FROM information_schema.columns
             WHERE table_schema='public' AND table_name='settings' AND column_name='id';
            IF setting_id_type <> 'integer' THEN
              RAISE EXCEPTION 'legacy settings id type changed: %', setting_id_type;
            END IF;
            IF pg_get_serial_sequence('public.settings','id') IS NULL THEN
              RAISE EXCEPTION 'legacy settings sequence was lost';
            END IF;
            EXECUTE format('SELECT nextval(%L::regclass)', pg_get_serial_sequence('public.settings','id'))
              INTO next_setting_id;
            IF next_setting_id <= (SELECT max(id) FROM public.settings) THEN
              RAISE EXCEPTION 'legacy settings sequence did not advance beyond existing IDs: %', next_setting_id;
            END IF;
            IF (SELECT count(*) FROM pg_indexes
                 WHERE schemaname='public' AND tablename='logs'
                   AND indexname='logs_created_at_desc_idx') <> 1 THEN
              RAISE EXCEPTION 'partially applied audit migration index was not retained';
            END IF;
            IF (SELECT count(*) FROM information_schema.columns
                 WHERE table_schema='public' AND table_name='logs'
                   AND column_name IN ('operation_id','action','status','result','error','approved','recipient','subject','delivery_id')) <> 9 THEN
              RAISE EXCEPTION 'audit expansion migration did not recover all columns';
            END IF;
            IF (SELECT count(*) FROM information_schema.columns
                 WHERE table_schema='public' AND table_name='leads' AND column_name='website') <> 1
               OR (SELECT count(*) FROM information_schema.columns
                 WHERE table_schema='public' AND table_name='logs' AND column_name='level') <> 1 THEN
              RAISE EXCEPTION 'expected additive columns missing or duplicated';
            END IF;
          END $migration_check$;
          SQL
          # Exercise the real Supabase CLI v3 repair command against this
          # disposable PostgreSQL database only. The command changes the
          # migration ledger, not the schema; never point this at production.
          PGPASSWORD=postgres psql "$drift_url" --set ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA supabase_migrations;
          CREATE TABLE supabase_migrations.schema_migrations (
            version text PRIMARY KEY,
            statements text[],
            name text
          );
          INSERT INTO supabase_migrations.schema_migrations(version) VALUES
            ('20261119191911'), ('20261119192040'), ('20261119192145'),
            ('20261119192412'), ('20261119192559');
          SQL
          cli_dir="$RUNNER_TEMP/jarvis-supabase-cli-fixture"
          mkdir -p "$cli_dir/supabase"
          cat > "$cli_dir/supabase/config.toml" <<'TOML'
          project_id = "jarvis-cli-migration-fixture"
          TOML
          mkdir -p "$cli_dir/supabase/migrations"
          cp supabase/migrations/20261117090000_add_leads_website.sql "$cli_dir/supabase/migrations/"
          cp supabase/migrations/20261117100000_add_logs_level.sql "$cli_dir/supabase/migrations/"
          (
            cd "$cli_dir"
            # Both pre-existing schema effects are already present in this fixture.
            # Repair each distinct version independently; never execute the SQL here.
            supabase migration repair 20261117090000 --status applied --remote="$drift_url" --yes
            PGPASSWORD=postgres psql "$drift_url" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
              --command "SELECT count(*) = 6 FROM supabase_migrations.schema_migrations" | grep -qx t
            supabase migration repair 20261117100000 --status applied --remote="$drift_url" --yes
            PGPASSWORD=postgres psql "$drift_url" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
              --command "SELECT count(*) = 7 FROM supabase_migrations.schema_migrations" | grep -qx t
            # Exercise reverting/reapplying each ledger entry without touching schema.
            supabase migration repair 20261117090000 --status reverted --remote="$drift_url" --yes
            PGPASSWORD=postgres psql "$drift_url" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
              --command "SELECT count(*) = 6 FROM supabase_migrations.schema_migrations" | grep -qx t
            supabase migration repair 20261117090000 --status applied --remote="$drift_url" --yes
            supabase migration repair 20261117100000 --status reverted --remote="$drift_url" --yes
            PGPASSWORD=postgres psql "$drift_url" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
              --command "SELECT count(*) = 6 FROM supabase_migrations.schema_migrations" | grep -qx t
            supabase migration repair 20261117100000 --status applied --remote="$drift_url" --yes
            PGPASSWORD=postgres psql "$drift_url" --no-psqlrc --tuples-only --no-align --set ON_ERROR_STOP=1 \
              --command "SELECT count(*) = 7 FROM supabase_migrations.schema_migrations" | grep -qx t
          )
          # The local and remote histories must now show both unique versions.
          set +e
          (cd "$cli_dir" && supabase migration list --remote="$drift_url") \
            > "$RUNNER_TEMP/jarvis-migration-list.txt" 2>&1
          list_status=$?
          set -e
          echo "Supabase CLI migration list exit code with unique legacy versions: $list_status"
          cat "$RUNNER_TEMP/jarvis-migration-list.txt"
          test "$list_status" -eq 0
          grep -F "20261117090000" "$RUNNER_TEMP/jarvis-migration-list.txt"
          grep -F "20261117100000" "$RUNNER_TEMP/jarvis-migration-list.txt"
          # Repair is history-only: the already-existing effects and legacy
          # data remain untouched in this isolated fixture.
          PGPASSWORD=postgres psql "$drift_url" --set ON_ERROR_STOP=1 --command \
            "DO \$cli_repair_check\$ BEGIN
               IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                               WHERE table_schema='public' AND table_name='leads' AND column_name='website')
                  OR NOT EXISTS (SELECT 1 FROM information_schema.columns
                               WHERE table_schema='public' AND table_name='logs' AND column_name='level')
                  OR (SELECT count(*) FROM public.leads WHERE id='80000000-0000-0000-0000-000000000011') <> 1
                  OR (SELECT count(*) FROM public.logs WHERE id='80000000-0000-0000-0000-000000000012') <> 1 THEN
                 RAISE EXCEPTION 'CLI migration repair changed schema effects or legacy data';
               END IF;
             END \$cli_repair_check\$";
      - name: Run structured audit migrations and pgTAP security tests
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          audit_url="postgresql://postgres:postgres@127.0.0.1:5432/audit_test"
          PGPASSWORD=postgres createdb --host 127.0.0.1 --username postgres audit_test
          cat > "$RUNNER_TEMP/audit-test-setup.sql" <<'SQL'
          CREATE SCHEMA auth;
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          CREATE EXTENSION pgtap;
          CREATE OR REPLACE FUNCTION auth.jwt()
          RETURNS jsonb LANGUAGE sql STABLE
          AS 'SELECT current_setting(''request.jwt.claims'', true)::jsonb';
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid LANGUAGE sql STABLE
          AS 'SELECT nullif(current_setting(''request.jwt.claims'', true)::jsonb ->> ''sub'', '''')::uuid';
          GRANT USAGE ON SCHEMA auth, extensions TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.jwt() TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated, service_role;
          -- Mirror the live Jarvis production table definitions captured by
          -- the read-only catalog snapshot (PostgreSQL 17). Existing RLS is
          -- already enabled in production before these additive migrations.
          CREATE TABLE public.leads (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            company_name text NOT NULL,
            email text,
            status text DEFAULT 'new',
            created_at timestamptz NOT NULL DEFAULT timezone('utc', now()),
            consent_basis text,
            approved_to_contact boolean NOT NULL DEFAULT false,
            consent_confirmed_at timestamptz,
            opted_out boolean NOT NULL DEFAULT false,
            first_sent_at timestamptz,
            next_follow_up_at timestamptz,
            follow_up_count integer NOT NULL DEFAULT 0,
            followed_up_at timestamptz,
            last_message_id text,
            last_inbound_message_id text,
            reply_category text,
            updated_at timestamptz NOT NULL DEFAULT now(),
            website text,
            notes text,
            source text
          );
          CREATE TABLE public.tasks (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            lead_id uuid REFERENCES public.leads(id) ON DELETE SET NULL,
            title text NOT NULL,
            notes text,
            priority text NOT NULL DEFAULT 'normal'
              CHECK (priority = ANY (ARRAY['normal','high','urgent']::text[])),
            status text NOT NULL DEFAULT 'open'
              CHECK (status = ANY (ARRAY['open','done','cancelled']::text[])),
            due_at timestamptz,
            completed_at timestamptz,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE public.email_drafts (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            lead_id uuid REFERENCES public.leads(id) ON DELETE SET NULL,
            recipient text NOT NULL,
            subject text NOT NULL,
            body text NOT NULL,
            status text NOT NULL DEFAULT 'draft'
              CHECK (status = ANY (ARRAY['draft','approved','archived']::text[])),
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE public.settings (
            id serial PRIMARY KEY,
            key text NOT NULL UNIQUE,
            value jsonb,
            updated_at timestamp without time zone DEFAULT now()
          );
          CREATE TABLE public.logs (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            module text NOT NULL,
            message text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT timezone('utc', now()),
            level text NOT NULL DEFAULT 'info'
          );
          CREATE TABLE public.jarvis_memory (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            category text NOT NULL DEFAULT 'business_preference',
            content text NOT NULL CHECK (char_length(content) BETWEEN 1 AND 700),
            source text NOT NULL DEFAULT 'explicit_user_instruction',
            active boolean NOT NULL DEFAULT true,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE public.jarvis_proactive_state (
            key text PRIMARY KEY,
            snapshot jsonb NOT NULL DEFAULT '{}'::jsonb,
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE public.posts (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            content text NOT NULL,
            scheduled_for timestamptz,
            status text DEFAULT 'pending',
            created_at timestamptz NOT NULL DEFAULT timezone('utc', now())
          );
          ALTER TABLE public.leads ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.tasks ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.email_drafts ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.settings ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.logs ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.jarvis_memory ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.jarvis_proactive_state ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.posts ENABLE ROW LEVEL SECURITY;
          -- Simulate a legacy production row written before structured audit
          -- columns and hash-chain triggers were introduced.
          INSERT INTO public.logs (id, module, message, level)
          VALUES ('80000000-0000-0000-0000-000000000001',
                  'legacy_fixture', 'preserve this pre-migration event', 'info');
          SQL
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file "$RUNNER_TEMP/audit-test-setup.sql"
          # Replay the repository's historical, idempotent schema migrations
          # against the production-shape fixture before the audit/RBAC chain.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261117090000_add_leads_website.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261117100000_add_logs_level.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261119191911_create_jarvis_memory_and_fk_indexes.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261119192040_complete_jarvis_runtime_schema.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261119192145_enable_rls_on_legacy_posts.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261119192412_revoke_anon_authenticated_public_table_and_sequence_privileges.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261119192559_secure_postgres_default_privileges_public_schema.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261120090000_expand_logs_audit_fields.sql
          # Failure injection: stop between migrations after expansion committed.
          # The next invocation must safely replay the completed migration.
          if PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --command "SELECT 1/0"; then
            echo "Expected injected interruption after audit expansion did not occur."
            exit 1
          else
            echo "Observed expected interruption after audit expansion."
          fi
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261120090000_expand_logs_audit_fields.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261123093000_admin_audit_access_and_hash_chain.sql
          # Second failure boundary: hash-chain migration committed, RBAC not yet run.
          if PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --command "SELECT 1/0"; then
            echo "Expected injected interruption after hash-chain migration did not occur."
            exit 1
          else
            echo "Observed expected interruption after hash-chain migration."
          fi
          # Forward recovery replays the last committed migration before proceeding.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261123093000_admin_audit_access_and_hash_chain.sql
          output="$(PGPASSWORD=postgres psql --no-psqlrc --no-align --tuples-only "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/audit_access_and_integrity.test.sql)"
          printf '%s\n' "$output"
          if grep -q '^not ok ' <<< "$output"; then
            echo "pgTAP reported failed audit assertions."
            exit 1
          fi
          grep -q '1..17' <<< "$output"
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261124130000_shared_workspace_role_access.sql
          # Replaying the final migration proves recovery after a committed RBAC step.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261124130000_shared_workspace_role_access.sql
          rbac_output="$(PGPASSWORD=postgres psql --no-psqlrc --no-align --tuples-only "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/shared_workspace_role_access.test.sql)"
          printf '%s\n' "$rbac_output"
          if grep -q '^not ok ' <<< "$rbac_output"; then
            echo "pgTAP reported failed RBAC assertions."
            exit 1
          fi
          grep -q '1..36' <<< "$rbac_output"
          # Add the stable task-creation idempotency key after the existing
          # RBAC schema is in place; replay to verify forward recovery.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261125150000_task_creation_idempotency.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261125150000_task_creation_idempotency.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/task_creation_idempotency.test.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261125160000_atomic_task_approvals_and_operations.sql
          # Replaying this migration must preserve the approval/idempotency schema.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261125160000_atomic_task_approvals_and_operations.sql
          # Run two simultaneous executions with the same approval and operation ID.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/task_approval_concurrency_setup.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/task_approval_concurrency_execute.sql > "$RUNNER_TEMP/task-approval-race-1.log" &
          race_pid_1=$!
          # The first session sleeps inside its task INSERT while holding the operation row lock.
          sleep 0.5
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/task_approval_concurrency_execute.sql > "$RUNNER_TEMP/task-approval-race-2.log" &
          race_pid_2=$!
          wait "$race_pid_1"
          wait "$race_pid_2"
          cat "$RUNNER_TEMP/task-approval-race-1.log" "$RUNNER_TEMP/task-approval-race-2.log"
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/task_approval_concurrency_verify.sql
          # Lock down the legacy service_role table-write path only after the RPC path exists.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261125170000_enforce_atomic_task_write_privileges.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261125170000_enforce_atomic_task_write_privileges.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/task_approval_service_role.test.sql
          # A failed final audit append must roll back the task and approval consumption.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/task_approval_audit_fail_closed.sql
          # Verify approval replay returns the stored result and revoke blocks execution.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/task_approval_replay_revoke.test.sql
          # Add normalized email uniqueness only after a locked, non-destructive duplicate preflight.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261125180000_unique_normalized_lead_email.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261125180000_unique_normalized_lead_email.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/lead_email_uniqueness.test.sql
          # Install the atomic company identity registry and consent-aware contact ranking.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261126120000_atomic_company_lead_identity_and_contact_priority.sql
          # Replay must be idempotent and preserve all identity/contact records.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261126120000_atomic_company_lead_identity_and_contact_priority.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/lead_company_identity_priority.test.sql
          # Exercise the identity claim from two overlapping PostgreSQL sessions.
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/lead_company_identity_concurrency_setup.sql
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/lead_company_identity_concurrency_execute.sql > "$RUNNER_TEMP/lead-identity-race-1.log" &
          identity_race_pid_1=$!
          for attempt in $(seq 1 50); do
            if grep -q "created" "$RUNNER_TEMP/lead-identity-race-1.log"; then break; fi
            sleep 0.1
          done
          grep -q "created" "$RUNNER_TEMP/lead-identity-race-1.log"
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/lead_company_identity_concurrency_execute.sql > "$RUNNER_TEMP/lead-identity-race-2.log" &
          identity_race_pid_2=$!
          wait "$identity_race_pid_1"
          wait "$identity_race_pid_2"
          cat "$RUNNER_TEMP/lead-identity-race-1.log" "$RUNNER_TEMP/lead-identity-race-2.log"
          grep -q "created" "$RUNNER_TEMP/lead-identity-race-1.log"
          grep -q "existing" "$RUNNER_TEMP/lead-identity-race-2.log"
          PGPASSWORD=postgres psql "$audit_url" --set ON_ERROR_STOP=1 --file supabase/tests/lead_company_identity_concurrency_verify.sql
          # Prove duplicate legacy rows stop the migration without modifying data.
          preflight_url="postgresql://postgres:postgres@127.0.0.1:5432/lead_email_preflight_test"
          PGPASSWORD=postgres createdb --host 127.0.0.1 --username postgres lead_email_preflight_test
          PGPASSWORD=postgres psql "$preflight_url" --set ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.leads (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            company_name text NOT NULL,
            email text
          );
          INSERT INTO public.leads (company_name, email) VALUES
            ('legacy duplicate one', 'same@example.invalid'),
            ('legacy duplicate two', ' SAME@example.invalid ');
          SQL
          if PGPASSWORD=postgres psql "$preflight_url" --set ON_ERROR_STOP=1 --file supabase/migrations/20261125180000_unique_normalized_lead_email.sql; then
            echo "Duplicate legacy emails unexpectedly passed migration preflight."
            exit 1
          fi
          remaining="$(PGPASSWORD=postgres psql "$preflight_url" --no-psqlrc --tuples-only --no-align --command "SELECT count(*) FROM public.leads")"
          test "$remaining" = "2"
          index_count="$(PGPASSWORD=postgres psql "$preflight_url" --no-psqlrc --tuples-only --no-align --command "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND tablename='leads' AND indexname='leads_email_normalized_uidx'")"
          test "$index_count" = "0"
      - name: Verify audit and RBAC catalog postconditions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          catalog_url="postgresql://postgres:postgres@127.0.0.1:5432/audit_test"
          PGPASSWORD=postgres psql "$catalog_url" --set ON_ERROR_STOP=1 \
            --file supabase/tests/catalog_postconditions.test.sql
      - name: Run real encrypted backup and restore roundtrip
        run: python -m pytest -q tests/test_backup_restore_integration.py
      - name: Remove test age identity
        if: always()
        run: rm -f "$RUNNER_TEMP/jarvis-age-identity.txt" "$RUNNER_TEMP/age-keygen.log"
