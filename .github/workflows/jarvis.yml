name: JARVIS Daily Pipeline
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
concurrency:
  group: jarvis-daily-pipeline
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run-jarvis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Inbox replies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python inbox_monitor.py
      - name: Import reviewed CSV
        if: ${{ hashFiles('data/leads.csv') != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python lead_gen.py
      - name: First-contact emails (disabled unless explicitly enabled)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_SEND_ENABLED: ${{ vars.AUTO_SEND_ENABLED }}
          SEND_MAX_PER_RUN: "3"
          SEND_DELAY_SECONDS: "30"
        run: python email_sender.py
      - name: Due follow-ups (disabled unless explicitly enabled)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_SEND_ENABLED: ${{ vars.AUTO_SEND_ENABLED }}
          FOLLOW_UP_MAX_PER_RUN: "3"
          SEND_DELAY_SECONDS: "30"
        run: python follow_up.py
      - name: Status report
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python jarvis_status.py
