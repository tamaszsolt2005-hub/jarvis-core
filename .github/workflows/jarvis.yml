name: JARVIS Pipeline (disabled)
# The product is chat-only. No scheduled or manual job may import data,
# inspect mailboxes, mutate Supabase records, or send messages.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm background automation is disabled
        run: echo "JARVIS background automation is disabled. Use the read-only chat application."
