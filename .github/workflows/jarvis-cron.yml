name: Legacy JARVIS Pipeline (disabled)
# Retired duplicate pipeline. Kept as a manual no-op so old scheduled jobs
# cannot import data or interact with email/Supabase in the background.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm legacy pipeline is disabled
        run: echo "Legacy pipeline disabled. Use the chat-first JARVIS application."
