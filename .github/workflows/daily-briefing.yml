name: JARVIS Daily Executive Briefing

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-daily-executive-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check required secrets
        id: config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_URL" && ( -n "$SUPABASE_SERVICE_ROLE_KEY" || -n "$SUPABASE_KEY" ) ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Daily briefing skipped: required GitHub Actions secrets are not configured."
          fi
      - name: Generate read-only daily briefing
        if: steps.config.outputs.ready == 'true'
        run: python daily_briefing.py
      - name: Publish report artifact
        if: steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-daily-briefing
          path: daily_briefing.md
          if-no-files-found: error
          retention-days: 14
